name: Create release

on:
  push:
    branches:
      - main
    paths:
      - VERSION.txt

permissions:
  contents: read

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTO_MAINTENANCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_MAINTENANCE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Create release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "$(wc -l < VERSION.txt)" -eq 1 ]] || { printf '%s\n' 'VERSION.txt must contain exactly one newline-terminated line' >&2; exit 1; }
          version=$(<VERSION.txt)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            printf '%s\n' 'VERSION.txt must contain strict X.Y.Z version' >&2
            exit 1
          }

          tag="v$version"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            printf 'Tag %s already exists\n' "$tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            printf 'Release %s already exists\n' "$tag" >&2
            exit 1
          fi

          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes
