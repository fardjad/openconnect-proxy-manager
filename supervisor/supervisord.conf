[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0

[program:webui]
command=uv run --no-sync uvicorn app:app --host 0.0.0.0 --port %(ENV_OCPM_WEBUI_PORT)s --no-access-log
directory=/ocpm
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:glider]
command=/usr/local/bin/glider -config /etc/ocpm/glider.conf
directory=/etc/ocpm
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
